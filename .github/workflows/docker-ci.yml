name: Docker CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate multi-architecture image
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
    with:
      output: image
      push: false
      distribute: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: ci
      cache-mode: max
      meta-images: quay.io/herocc/moos-ivp-cc
      meta-tags: type=sha,prefix=ci-
