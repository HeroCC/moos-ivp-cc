name: Docker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build multi-architecture image
    runs-on: ubuntu-latest
    outputs:
      source: quay.io/herocc/moos-ivp-cc@${{ steps.build.outputs.digest }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: quay.io/herocc/moos-ivp-cc
          tags: type=sha,prefix=

      - name: Log in to Quay to stage the canonical image
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PUSH_KEY }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: quay.io/herocc/moos-ivp-cc:ci-${{ github.sha }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          provenance: mode=max
          sbom: true
          build-args: BUILDKIT_MULTI_PLATFORM=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record canonical image digest
        if: github.event_name == 'push'
        run: |
          echo "Canonical image: quay.io/herocc/moos-ivp-cc@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to Quay
    if: github.event_name == 'push'
    needs: build
    uses: ./.github/workflows/publish-image.yml
    with:
      source_registry: quay.io
      source: ${{ needs.build.outputs.source }}
      source_username: ${{ vars.QUAY_USERNAME }}
      version: ${{ needs.build.outputs.version }}
      registry: quay.io
      image: quay.io/herocc/moos-ivp-cc
      username: ${{ vars.QUAY_USERNAME }}
    secrets:
      source_password: ${{ secrets.QUAY_PUSH_KEY }}
      registry_password: ${{ secrets.QUAY_PUSH_KEY }}

  publish-docker-hub:
    name: Publish to Docker Hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    uses: ./.github/workflows/publish-image.yml
    with:
      source_registry: quay.io
      source: ${{ needs.build.outputs.source }}
      source_username: ${{ vars.QUAY_USERNAME }}
      version: ${{ needs.build.outputs.version }}
      registry: docker.io
      image: herocc/moos-ivp-cc
      username: ${{ vars.DOCKER_HUB_USERNAME }}
    secrets:
      source_password: ${{ secrets.QUAY_PUSH_KEY }}
      registry_password: ${{ secrets.DOCKER_HUB_PUSH_KEY }}

  artifacts:
    name: Save build artifacts
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PUSH_KEY }}

      - name: Pull canonical image
        run: docker pull "${{ needs.build.outputs.source }}"

      - name: Extract bin and lib directories
        run: |
          container_id="$(docker create '${{ needs.build.outputs.source }}')"
          mkdir -p artifacts
          docker cp "$container_id:/home/moos/moos-ivp-cc/bin" artifacts/bin
          docker cp "$container_id:/home/moos/moos-ivp-cc/lib" artifacts/lib
          docker rm "$container_id"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: moos-ivp-cc-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
