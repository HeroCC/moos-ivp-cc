name: Docker

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate multi-architecture image
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max

  release:
    name: Build and publish trusted image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            quay.io/herocc/moos-ivp-cc
            herocc/moos-ivp-cc
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Log in to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PUSH_KEY }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PUSH_KEY }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          provenance: mode=max
          sbom: true
          build-args: BUILDKIT_MULTI_PLATFORM=1
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      - name: Attest image
        uses: actions/attest@v4
        with:
          subject-name: quay.io/herocc/moos-ivp-cc
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Extract build artifacts
        run: |
          image="quay.io/herocc/moos-ivp-cc@${{ steps.build.outputs.digest }}"
          docker pull "$image"
          container_id="$(docker create "$image")"
          mkdir -p artifacts
          docker cp "$container_id:/home/moos/moos-ivp-cc/bin" artifacts/bin
          docker cp "$container_id:/home/moos/moos-ivp-cc/lib" artifacts/lib
          docker rm "$container_id"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: moos-ivp-cc-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

      - name: Record image digest
        run: |
          echo "Image digest: quay.io/herocc/moos-ivp-cc@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
