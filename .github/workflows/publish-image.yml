name: Publish container image

on:
  workflow_call:
    inputs:
      source_registry:
        required: true
        type: string
      source:
        required: true
        type: string
      source_username:
        required: true
        type: string
      version:
        required: true
        type: string
      registry:
        required: true
        type: string
      image:
        required: true
        type: string
      username:
        required: true
        type: string
    secrets:
      source_password:
        required: true
      registry_password:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to source registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.source_registry }}
          username: ${{ inputs.source_username }}
          password: ${{ secrets.source_password }}

      - name: Log in to target registry
        if: inputs.registry != inputs.source_registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.username }}
          password: ${{ secrets.registry_password }}

      - name: Copy the canonical image by digest
        run: |
          docker buildx imagetools create \
            --tag "${{ inputs.image }}:${{ inputs.version }}" \
            --tag "${{ inputs.image }}:latest" \
            "${{ inputs.source }}"
