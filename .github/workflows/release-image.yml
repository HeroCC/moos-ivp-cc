name: Release container image

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish trusted image
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: true
      distribute: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: release
      cache-mode: max
      sbom: true
      sign: auto
      set-meta-labels: true
      set-meta-annotations: true
      meta-images: |
        quay.io/herocc/moos-ivp-cc
        herocc/moos-ivp-cc
      meta-tags: |
        type=sha,prefix=
        type=ref,event=tag
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
    secrets:
      registry-auths: |
        - registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PUSH_KEY }}
        - registry: docker.io
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PUSH_KEY }}

  artifacts:
    name: Publish build artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PUSH_KEY }}

      - name: Extract build artifacts
        run: |
          image="quay.io/herocc/moos-ivp-cc@${{ needs.build.outputs.digest }}"
          docker pull "$image"
          container_id="$(docker create "$image")"
          mkdir -p artifacts
          docker cp "$container_id:/home/moos/moos-ivp-cc/bin" artifacts/bin
          docker cp "$container_id:/home/moos/moos-ivp-cc/lib" artifacts/lib
          docker rm "$container_id"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: moos-ivp-cc-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

      - name: Record image digest
        run: |
          echo "Image digest: quay.io/herocc/moos-ivp-cc@${{ needs.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
